name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: grep -v '^torch' requirements.txt > /tmp/requirements-cpu.txt && pip install -r /tmp/requirements-cpu.txt pytest
      - run: python -m pytest tests -q
      - run: python scripts/make_tables.py
      - run: python scripts/session_audit.py overlap audit/session_keys.csv Data
